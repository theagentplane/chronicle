name: Release

# Pushing a tag like v0.1.0 builds the package and publishes it to PyPI using
# Trusted Publishing (OIDC): no API tokens are stored. One-time setup is described
# in RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time; never cancel a publish that is already running.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Verify the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c "import runpy; print(runpy.run_path('src/chronicle/_version.py')['__version__'])")"
          echo "tag: ${TAG#v} | package version: ${version}"
          if [ "${TAG#v}" != "${version}" ]; then
            echo "::error::Tag ${TAG} does not match package version ${version}. Bump _version.py and merge it first."
            exit 1
          fi
      - run: uv sync
      - run: uv build
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Matches the `pypi` environment and workflow name configured on PyPI.
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); no stored token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
