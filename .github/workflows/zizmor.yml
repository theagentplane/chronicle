name: zizmor

# Static analysis of the workflows themselves: unpinned actions, excess token permissions,
# template injection, credential persistence, dangerous triggers. Fails the check on any
# finding. Fix it, or suppress it inline with a reason (see pr-size.yml for an example).
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
      actions: read # read workflow metadata for the online audits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
