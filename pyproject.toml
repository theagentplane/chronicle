[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-chronicle"
dynamic = ["version"]
description = "Record-and-replay for agent decision graphs: capture what an agent did, save it to the control plane, and replay a request with the downstream calls stubbed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Tisha Chawla" },
    { name = "Susheem Koul" },
]
keywords = [
    "llm",
    "agents",
    "observability",
    "record-replay",
    "testing",
    "regression",
    "tracing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# Pre-1.0 rule (docs/versioning.md in primitives): pin the exact minor of primitives.
dependencies = [
    "agentplane-primitives==0.2.*",
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# LangGraph instrumentation (chronicle.instrument).
langgraph = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
# LLM-as-judge client (chronicle.judge). The judge itself is out of scope for the rewrite.
judge = [
    "openai>=1",
]

[project.urls]
Homepage = "https://github.com/theagentplane/chronicle"
Repository = "https://github.com/theagentplane/chronicle"
Issues = "https://github.com/theagentplane/chronicle/issues"
Changelog = "https://github.com/theagentplane/chronicle/blob/main/CHANGELOG.md"

# PEP 735 dependency groups: development-only, never part of the published metadata.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "build>=1.2",
    "twine>=5",
    "pre-commit>=4",
    # Provider SDKs and agent frameworks used by the conformance and end-to-end suites.
    "openai>=1",
    "anthropic>=0.40",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "a2a-sdk[http-server]>=1.2",
    # Local test servers.
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[tool.hatch.version]
path = "src/chronicle/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicle"]

[tool.hatch.build.targets.sdist]
include = [
    "src/chronicle",
    "docs",
    "tests",
    "CHANGELOG.md",
    "LICENSE.txt",
    "README.md",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"
extend-exclude = ["_legacy_demos"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "PT",  # pytest style
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["chronicle"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["_legacy_demos"]

[[tool.mypy.overrides]]
# Optional third-party integrations are imported lazily and are not all typed.
module = ["langgraph.*", "langchain_core.*", "langchain_openai.*", "a2a.*", "uvicorn.*", "control_plane.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
norecursedirs = ["_legacy_demos"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "e2e: multi-agent systems over A2A and HTTP, run against local servers only",
    "live: calls the real OpenAI and Anthropic APIs; needs keys, never run by default or in CI",
]

[tool.coverage.run]
source = ["chronicle"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
